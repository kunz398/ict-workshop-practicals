<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Rainfall Widget</title>
</head>
<body>
  <h1>Live Rainfall Forecast</h1>
  <div id="weather-widget">Loading...</div>

  <script>
    // CHANGE these coordinates to your own country's capital, then refresh the page
    const latitude = -18.1;
    const longitude = 178.4;

    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=precipitation_sum&timezone=auto`)
      .then(response => response.json())
      .then(data => {
        const today = data.daily.precipitation_sum[0];
        document.getElementById("weather-widget").innerText =
          "Today's expected rainfall: " + today + " mm";
      })
      .catch(error => {
        document.getElementById("weather-widget").innerText = "Could not load forecast.";
        console.error(error);
      });
  </script>
</body>
</html>
