<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station Map - sample_stations.geojson</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    h1 { font-size: 18px; margin: 12px; }
    #map { height: 80vh; width: 100%; }
  </style>
</head>
<body>
  <h1>Pacific Stations - from sample_stations.geojson</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // This is the same content as sample_stations.geojson in this folder, kept here as a backup copy
    // so this page still works if you just double-click it (browsers block loading a local sibling
    // file that way). If you're running this through a local server (e.g. in a Codespace), it will
    // fetch the real file instead - see below.
    const fallbackGeoJSON = {
      "type": "FeatureCollection",
      "features": [
        { "type": "Feature", "properties": { "station_id": "auasi", "name": "Samoa, Auasi - Tide Gauge", "station_type": "Tide Gauge" }, "geometry": { "type": "Point", "coordinates": [-170.57307, -14.271544] } },
        { "type": "Feature", "properties": { "station_id": "upol", "name": "Samoa, Apia - Tide Gauge", "station_type": "Tide Gauge" }, "geometry": { "type": "Point", "coordinates": [-171.7613, -13.8268] } },
        { "type": "Feature", "properties": { "station_id": "mala", "name": "Palau, Malakal - Tide Gauge", "station_type": "Tide Gauge" }, "geometry": { "type": "Point", "coordinates": [134.4502, 7.3282] } },
        { "type": "Feature", "properties": { "station_id": "SPOT-0303", "name": "Tuvalu, Funafuti - Wave Buoy", "station_type": "Wave Buoy" }, "geometry": { "type": "Point", "coordinates": [179.05518, -8.591] } },
        { "type": "Feature", "properties": { "station_id": "SPOT-0301", "name": "Kiribati, Tarawa - Wave Buoy", "station_type": "Wave Buoy" }, "geometry": { "type": "Point", "coordinates": [173.01658, 1.33658] } },
        { "type": "Feature", "properties": { "station_id": "SPOT-0403", "name": "Solomon Islands - Wave Buoy", "station_type": "Wave Buoy" }, "geometry": { "type": "Point", "coordinates": [159.94742, -9.42227] } }
      ]
    };

    const map = L.map('map').setView([-10, 170], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function plot(geojson) {
      L.geoJSON(geojson, {
        onEachFeature: function (feature, layer) {
          const p = feature.properties;
          layer.bindPopup(
            "<b>" + p.name + "</b><br>" +
            "Type: " + p.station_type + "<br>" +
            "station_id: " + p.station_id
          );
        }
      }).addTo(map);
    }

    // Try loading the real file first (works when served over http, e.g. python3 -m http.server).
    // Falls back to the copy above if that's blocked (e.g. double-clicked directly, file://).
    fetch('sample_stations.geojson')
      .then(response => response.json())
      .then(plot)
      .catch(() => plot(fallbackGeoJSON));
  </script>
</body>
</html>
